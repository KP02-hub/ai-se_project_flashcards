<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Keith Perkins" />
    <meta
      name="description"
      content="A flashcard app for studying and reviewing topics."
    />
    <meta name="keywords" content="flashcard, study aids, learning materials" />
    <title>Flash Cards</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li>
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="decks" id="home">
        <h2 class="decks__title">My Decks</h2>
        <div class="decks__row">
          <ul class="decks__list"></ul>
          <button type="button" class="decks__new-deck-btn gallery__new-card-btn">+ New Deck</button>
        </div>
      </section>
      <section class="new-deck-view" id="new-deck-view" hidden>
        <h2 class="decks__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="color-picker">
            <legend>Deck color</legend>
            <input type="radio" name="color" id="green" value="#64d583" aria-label="green" checked />
            <label for="green" style="--swatch: #64d583"></label>
            <input type="radio" name="color" id="blue" value="#91a8f9" aria-label="blue" />
            <label for="blue" style="--swatch: #91a8f9"></label>
            <input type="radio" name="color" id="orange" value="#ee955e" aria-label="orange" />
            <label for="orange" style="--swatch: #ee955e"></label>
            <input type="radio" name="color" id="pink" value="#ee92d7" aria-label="pink" />
            <label for="pink" style="--swatch: #ee92d7"></label>
            <input type="radio" name="color" id="purple" value="#aa8ef0" aria-label="purple" />
            <label for="purple" style="--swatch: #aa8ef0"></label>
            <input type="radio" name="color" id="yellow" value="#f5d770" aria-label="yellow" />
            <label for="yellow" style="--swatch: #f5d770"></label>
          </fieldset>
          <label class="new-deck-view__field">Deck JSON
            <textarea name="json" rows="9" placeholder="Paste your deck JSON here"></textarea>
          </label>
          <button type="submit" disabled>Create Deck</button>
        </form>
      </section>
      <section id="open-deck" class="decks" hidden>
        <h2 class="decks__title"></h2>
        <a class="decks__practice" href="#home">Practice</a>
        <div class="decks__row">
          <ul class="decks__list"></ul>
          <button type="button" class="decks__new-deck-btn">+ New Card</button>
        </div>
      </section>
      <template id="flashcard-template">
        <li class="deck">
          <h3 class="deck__title"></h3>
          <div class="deck__row">
            <button type="button" class="deck__flip" aria-label="Flip card"></button>
            <button type="button" class="deck__delete-btn" aria-label="Delete card"></button>
          </div>
        </li>
      </template>
      <section class="carousel" id="carousel" hidden>
        <h2 class="carousel__title"></h2>
        <div class="carousel__grid">
          <button type="button" class="carousel__btn carousel__btn_type_left" aria-label="Previous card"></button>
          <div class="carousel__card"><p class="carousel__card-text"></p></div>
          <button type="button" class="carousel__btn carousel__btn_type_right" aria-label="Next card"></button>
          <button type="button" class="carousel__btn carousel__btn_type_flip" aria-label="Flip card"></button>
        </div>

      </section>
      <section class="not-found" id="not-found" hidden>
        <h2>404 Not Found</h2>
        <p>We couldn't find that page. <a href="#home">Back to My Decks</a></p>
      </section>
      <template id="deck-template">
        <li class="deck deck_color_green">
          <a class="deck__link" href="#" aria-label="Open deck"></a>
          <h3 class="deck__title"></h3>
          <div class="deck__row">
            <p class="deck__count"></p>
            <button type="button" class="deck__delete-btn" aria-label="Delete deck"></button>
          </div>
        </li>
      </template>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Keith Perkins</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
