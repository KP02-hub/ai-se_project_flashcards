<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Keith Perkins" />
    <meta
      name="description"
      content="A flashcard app for studying and reviewing topics."
    />
    <meta name="keywords" content="flashcard, study aids, learning materials" />
    <title>Flash Cards</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="./index.html">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a class="nav__link" href="#">My Decks</a>
          </li>
          <li>
            <a class="nav__link" href="#">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content page__main-content_location_carousel">
      <section class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>

        <div class="carousel__row">
          <button
            type="button"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            aria-label="Previous card"
            disabled
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>

          <button
            type="button"
            class="carousel__btn carousel__btn_type_right"
            aria-label="Next card"
          ></button>
        </div>

        <button
          type="button"
          class="carousel__btn carousel__btn_type_flip"
          aria-label="Flip card"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Keith Perkins</p>
    </footer>
  </body>
</html>
